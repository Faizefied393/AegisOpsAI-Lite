[project]
name = "aegisops-ai-lite"
version = "1.0.0"
description = "Evidence-grounded AI SOC and business risk reference application"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "requests>=2.31,<3", "streamlit>=1.35,<2", "pandas>=2,<3", "langgraph>=0.3", "scikit-learn>=1.4", "joblib>=1.3", "pyyaml>=6", "opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25", "opentelemetry-instrumentation-fastapi>=0.46b0"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ml*", "detections*", "evaluations*", "dashboard*"]
exclude = ["tests*", "data*", "docs*", "scripts*"]